<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration Form</title>
</head>
<body>
<h2>User Registration Form</h2>

<form action="#" method="post">
   
    <label for="fname">First Name:</label>
    <input type="text" id="fname" name="fname" placeholder="John">
    <br>
    <br />
    <label for="lname">Last Name:</label>
    <input type="text" id="lname" name="lname" placeholder="Mensah">
    <br>
    <br />
    <label for="password">Password:</label>
    <input type="password" id="password" name="password" maxlength="15" placeholder="Favorite Dog">
    <br>
    <br />
   
    <label>Interests:</label>
    <br />
    <input type="checkbox" id="football" name="sports" value="football">
    <label for="football">Football</label>
    <br />
    <input type="checkbox" id="music" name="sports" value="music">
    <label for="music">Music</label>
    <br />
    <input type="checkbox" id="movies" name="sports" value="movies">
    <label for="movies">Movies</label>
    <br />
    <br />
    <label for="male">Gender:</label>
    <input type="radio" id="male" name="gender" value="male">
    <br />
    <label for="female">Female</label>
    <input type="radio" id="female" name="gender" value="female">
    <br /><br />
    <input type="submit" value="Submit">
<br />
<br />

</form>

</body>
</html>
